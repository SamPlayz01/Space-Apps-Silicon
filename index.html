<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometric Solar System · Ustyurt Analog Atlas</title>
<style>
:root{
  color-scheme:dark;
  --bg:#05060a;--fg:#ece8de;--dim:rgba(236,232,222,.52);--faint:rgba(236,232,222,.3);
  --hair:rgba(236,232,222,.1);--gold:#d6b46f;--sw:320px;
  --sans:"Inter","Helvetica Neue","SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,ui-serif,serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;text-align:left}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#c:active{cursor:grabbing}

/* ---------- sidebar ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);z-index:5;display:flex;flex-direction:column;
  background:linear-gradient(90deg,rgba(8,9,12,.9),rgba(8,9,12,.76));backdrop-filter:blur(26px) saturate(1.1);-webkit-backdrop-filter:blur(26px) saturate(1.1);
  border-right:1px solid var(--hair);transition:transform .8s var(--ease)}
#side.off{transform:translateX(-102%)}
.sh{display:flex;justify-content:space-between;align-items:flex-start;padding:30px 28px 6px}
.wm{font-size:10px;letter-spacing:.34em;text-transform:uppercase;line-height:1.7}
.wm span{display:block;color:var(--faint);letter-spacing:.22em}
#cls{width:22px;height:22px;position:relative;opacity:.55;transition:opacity .3s}
#cls:hover{opacity:1}
#cls:before,#cls:after{content:"";position:absolute;left:3px;right:3px;height:1px;background:var(--fg)}
#cls:before{top:8px}#cls:after{top:13px}
#opn{position:fixed;left:22px;top:26px;z-index:6;width:22px;height:22px;opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
#opn:before,#opn:after{content:"";position:absolute;left:3px;right:3px;height:1px;background:var(--fg)}
#opn:before{top:8px}#opn:after{top:13px}
body.sideoff #opn{opacity:.7;pointer-events:auto}
body.sideoff #opn:hover{opacity:1}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:18px;opacity:0;visibility:hidden;transform:translateX(14px);transition:opacity .5s var(--ease),transform .6s var(--ease),visibility 0s .6s;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
#side[data-v=idx] #idx,#side[data-v=det] #det{opacity:1;visibility:visible;transform:none;transition:opacity .5s var(--ease) .08s,transform .6s var(--ease) .08s,visibility 0s}
h3{margin:0;padding:26px 28px 10px;font-size:10px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.row{display:grid;grid-template-columns:18px 1fr auto;align-items:baseline;width:100%;padding:9px 28px 9px 26px;font-size:13px;color:var(--dim);border-left:2px solid transparent;transition:color .25s,background .25s,border-color .25s}
.row:hover{color:var(--fg);background:rgba(236,232,222,.04)}
.row.on{color:var(--fg);border-left-color:var(--gold);background:rgba(236,232,222,.04)}
.row .dt{width:6px;height:6px;border-radius:50%;display:block;align-self:center;opacity:.9}
.row .dt.g{background:var(--gold)}
.row small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.row em{font-style:normal;font-size:11px;color:var(--faint);white-space:nowrap}
.grp{padding:14px 28px 4px;font-size:11px;color:var(--fg);letter-spacing:.04em;display:flex;justify-content:space-between}
.grp em{font-style:normal;color:var(--faint);font-size:10px;letter-spacing:.2em}
.cta{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 56px);margin:22px 28px 0;padding:14px 16px;background:var(--fg);color:#0a0a0c;font-size:10px;letter-spacing:.26em;text-transform:uppercase;transition:background .3s,transform .5s var(--ease)}
.cta:hover{background:#fff}
.cta i{font-style:normal;letter-spacing:0;transition:transform .5s var(--ease)}
.cta:hover i{transform:translateX(4px)}
.cta.ghost{background:none;color:var(--fg);border:1px solid var(--hair);margin-top:10px}
.cta.ghost:hover{border-color:var(--fg);background:none}
.bk{display:block;padding:8px 28px 0;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);transition:color .25s}
.bk:hover{color:var(--fg)}
.dh{padding:18px 28px 0}
.dh h2{margin:0;font:300 36px/1.04 var(--serif);letter-spacing:-.015em}
.dh .rg{margin-top:10px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.dh p{margin:16px 0 0;font-size:13px;line-height:1.7;color:var(--dim)}
figure.fg{margin:22px 0 0;position:relative}
figure.fg img,figure.fg canvas{display:block;width:100%;aspect-ratio:2.5/1;object-fit:cover;background:#0b0c0f}
figure.fg figcaption{padding:9px 28px 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
dl.nums{margin:24px 28px 0;border-top:1px solid var(--hair)}
dl.nums div{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:baseline}
dl.nums dt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
dl.nums dd{margin:0;font-size:16px;font-weight:300;text-align:right;letter-spacing:.01em}
dl.nums dd small{font-size:10px;color:var(--dim);margin-left:4px;letter-spacing:.08em}
dl.nums .s{grid-column:1/-1;text-align:right;font-size:11px;color:var(--dim);margin-top:-2px}

/* ---------- time footer ---------- */
.sf{border-top:1px solid var(--hair);padding:16px 28px 24px}
.sf .t{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.sf .t button{letter-spacing:.2em;color:var(--dim);transition:color .25s}
.sf .t button:hover{color:var(--fg)}
#spd{display:flex;margin-top:12px;border:1px solid var(--hair)}
#spd button{flex:1;padding:8px 0;font-size:11px;text-align:center;color:var(--dim);border-right:1px solid var(--hair);transition:background .3s,color .3s}
#spd button:last-child{border-right:0}
#spd button:hover{color:var(--fg)}
#spd button.on{background:var(--fg);color:#0a0a0c}
#clock{margin-top:12px;font-size:11px;line-height:1.7;color:var(--dim)}
#clock b{font-weight:400;color:var(--fg)}

/* ---------- labels on the 3D scene ---------- */
#labels{position:fixed;inset:0;pointer-events:none}
.lb{position:fixed;left:0;top:0;padding:9px 10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);will-change:transform;pointer-events:auto;transition:color .25s}
.lb:hover{color:#fff}
.lb.m{font-size:9px;letter-spacing:.14em;color:rgba(236,232,222,.62)}
.lb.s{color:var(--gold);font-size:9px;letter-spacing:.2em}
.lb.s:before{content:"";display:inline-block;width:14px;height:1px;background:var(--gold);vertical-align:middle;margin-right:7px}

/* ---------- cinematic layer ---------- */
#lb1,#lb2{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;pointer-events:none;transition:height 1.5s var(--ease)}
#lb1{top:0}#lb2{bottom:0}
body.cine #lb1,body.cine #lb2{height:0}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at 50% 58%,transparent 52%,rgba(0,0,0,.6) 100%);transition:opacity 1.8s}
body.landed #vig{opacity:0}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .4s ease}
#where{position:fixed;top:26px;left:50%;transform:translateX(calc(-50% + var(--shift,0px)));z-index:4;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity 1.2s;pointer-events:none}
body.landed #where{opacity:1}
#where b{font-weight:400;color:var(--fg)}
#ret{position:fixed;right:28px;bottom:calc(7vh + 28px);z-index:6;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);opacity:0;pointer-events:none;transition:opacity .8s,color .25s;padding:8px 0;border-bottom:1px solid var(--hair)}
#ret:hover{color:var(--fg);border-color:var(--fg)}
body.landed #ret{opacity:1;pointer-events:auto}

#stage{position:fixed;left:calc(var(--sw) + 64px);bottom:calc(7vh + 44px);width:min(540px,calc(100vw - var(--sw) - 112px));z-index:6;opacity:0;pointer-events:none;transition:opacity 1s,left .8s var(--ease)}
body.sideoff #stage{left:max(40px,6vw);width:min(540px,calc(100vw - 80px))}
#stage.on{opacity:1}
#stage button{pointer-events:auto}
.ctr{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.ctr i{display:block;width:40px;height:1px;background:rgba(236,232,222,.28)}
.ctr span:last-child{color:var(--dim);letter-spacing:.22em}
#stH{margin:18px 0 14px;font:300 clamp(32px,4.4vw,56px)/1.02 var(--serif);letter-spacing:-.018em;text-shadow:0 2px 30px rgba(0,0,0,.6)}
#stP{margin:0;max-width:46ch;font-size:15px;line-height:1.75;color:rgba(236,232,222,.8);text-shadow:0 1px 20px rgba(0,0,0,.8)}
#stS{display:grid;grid-template-columns:repeat(2,auto);gap:20px 44px;justify-content:start;margin-top:4px}
#stS div b{display:block;font:300 clamp(26px,3vw,38px)/1 var(--serif);letter-spacing:-.01em}
#stS div span{display:block;margin-top:8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#stage.rev .ctr,#stage.rev #stH,#stage.rev #stP,#stage.rev #stS,#stage.rev .prog{animation:rise 1.1s var(--ease) both}
#stage.rev #stH{animation-delay:.12s}#stage.rev #stP,#stage.rev #stS{animation-delay:.28s}#stage.rev .prog{animation-delay:.45s}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
.prog{display:flex;gap:6px;margin-top:30px}
.prog i{position:relative;flex:1;height:1px;background:rgba(236,232,222,.2);overflow:hidden}
.prog i b{position:absolute;inset:0;background:var(--fg);transform:scaleX(0);transform-origin:left}
.sctl{display:flex;gap:26px;margin-top:18px;font-size:10px;letter-spacing:.26em;text-transform:uppercase}
.sctl button{color:var(--dim);transition:color .25s;padding:4px 0}
.sctl button:hover{color:var(--fg)}
.sctl #stAuto{display:inline-flex;align-items:center;gap:9px;color:var(--fg);min-width:92px}
.sctl #stAuto svg{width:11px;height:11px;fill:currentColor;flex:none}
body.spaused #stProg i b{opacity:.45}
#inset{position:fixed;right:28px;top:62px;width:min(340px,40vw);z-index:5;opacity:0;pointer-events:none;transition:opacity 1.2s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#inset.on{opacity:1}
#inset img,#inset canvas{display:block;width:100%;aspect-ratio:2.5/1;object-fit:cover}

.cap{margin:10px 28px 0;font-size:11px;line-height:1.6;color:var(--faint)}
.why{border-top:1px solid var(--hair);margin-top:4px}
.why p{margin:0;padding:11px 28px;font-size:13px;line-height:1.65;color:var(--dim);border-bottom:1px solid var(--hair)}
.why b{font-weight:400;color:var(--fg)}
#stP+#stS{margin-top:20px}
@media (max-width:759px){
  :root{--sw:min(86vw,340px)}
  #side{background:rgba(8,9,12,.92)}
  #stage{left:24px;width:calc(100vw - 48px);bottom:calc(7vh + 30px)}
  #stP{font-size:14px}
  #where{display:none}
}

/* ---------- logo intro ---------- */
#intro{position:fixed;inset:0;z-index:1000;background:#05060a;display:flex;align-items:center;justify-content:center;transition:opacity .85s cubic-bezier(.4,0,.2,1)}
#intro.out{opacity:0;pointer-events:none}
#iStage{position:relative;width:min(84vw,820px,calc(62vh*1015/685));aspect-ratio:1015/685;transition:transform .85s cubic-bezier(.4,0,.2,1),filter .85s}
#intro.out #iStage{transform:scale(1.05);filter:blur(5px)}
#iStage img{display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
#iEmb{position:absolute;opacity:0}
#iEmb img{width:100%;height:auto}
#iStar,.iL{position:absolute;height:auto;opacity:0;will-change:transform,opacity,filter}
#iBar{position:absolute;left:50%;bottom:9vh;width:132px;height:1px;margin-left:-66px;background:rgba(236,232,222,.12);overflow:hidden;transition:opacity .5s}
#iBar i{display:block;height:100%;background:rgba(236,232,222,.75);transform-origin:left;transform:scaleX(0)}
#iBar.wait i{animation:iPulse 1.4s ease-in-out infinite}
#intro.out #iBar,#intro.out #iSkip{opacity:0}
@keyframes iPulse{0%,100%{opacity:.35}50%{opacity:1}}
#iSkip{position:absolute;right:28px;bottom:26px;padding:8px 2px;font:10px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:rgba(236,232,222,.42);opacity:0;transition:opacity .6s,color .25s}
#iSkip:hover{color:#ece8de}
</style>
</head>
<body>

<div id="labels"></div>
<div id="vig"></div><div id="lb1"></div><div id="lb2"></div><div id="fade"></div>
<div id="where"></div>
<figure id="inset"></figure>

    <section class="view" id="idx"></section>
    <section class="view" id="det"></section>
  </div>
  <div class="sf">

    <div id="spd"></div>
    <div id="clock"></div>
  </div>
</aside>
<button id="opn" aria-label="Show panel"></button>

<div id="stage">

</div>

  const g=new THREE.Group();
  if(L.length)g.add(segs(L,white,.9));
  if(D.length)g.add(spots(D,white,3.5));
  return g;
}

/* planet-specific terrain: craters, volcanoes, canyons, polar caps, storms, bands, hurricanes */
function extras(b){
  const n=b.n,r=b.r,R=r*1.008,efn=b.fn===band?white:b.fn,L=[],D=[],K=[],M=[],Y=new THREE.Vector3(0,1,0),Z=new THREE.Vector3(0,-1,0);
  const kc=n==='Mars'?C(1,.82,.55):C(.35,1,.55),mc=n==='Mars'?C(1,.7,.35):C(.85,1,.72);
  const sv=(x,y,z)=>new THREE.Vector3(x,y,z).normalize();
  const cr=(k,lo,hi)=>{for(let i=0;i<k;i++){const c=rnd();L.push(...crater(c,lo+Math.random()*(hi-lo)*Math.random(),R));D.push(...c.multiplyScalar(R).toArray())}};
  const rings=(c,as,nn,sx)=>as.forEach(a=>L.push(...circ(c,a,R,nn||36,sx||1)));
  const sc=(k,pred)=>{for(let i=0,j=0;i<k&&j<k*40;j++){const c=rnd();if(!pred||pred(c)){D.push(...c.multiplyScalar(R).toArray());i++}}};
  const bands=(step,amp,w)=>{for(let la=-84;la<=84;la+=step){const f=la*Math.PI/180,q=x=>{const y=f+amp*Math.sin(x*w+la);return[Math.cos(x)*Math.cos(y)*R,Math.sin(y)*R,Math.sin(x)*Math.cos(y)*R]};for(let i=0;i<96;i++)L.push(...q(i/96*6.2832),...q((i+1)/96*6.2832))}};
  /* zig-zag mountain ridge along a lon/lat path */
  const ridge=(pts,amp)=>{
    let t=0,q=ll(pts[0],pts[1]).multiplyScalar(R);
    for(let i=0;i<pts.length-2;i+=2){
      const A=ll(pts[i],pts[i+1]),B2=ll(pts[i+2],pts[i+3]),m=Math.max(2,Math.ceil(A.angleTo(B2)/.03));
      for(let k=1;k<=m;k++){const p=A.clone().lerp(B2,k/m).normalize().multiplyScalar(R*(1+amp*(++t%2)));M.push(...q.toArray(),...p.toArray());q=p}
    }
  };
  /* canyon drawn as two rims joined by rungs */
  const ladder=(pts,w)=>{
    let prev=null,i=0;
    for(let s=0;s<pts.length-2;s+=2){
      const m=12;
      for(let k=0;k<m;k++,i++){
        const f=k/m,lo=pts[s]+(pts[s+2]-pts[s])*f,la=pts[s+1]+(pts[s+3]-pts[s+1])*f;
        const t=ll(lo,la+w).multiplyScalar(R),u=ll(lo,la-w).multiplyScalar(R);
        if(prev)M.push(...prev[0].toArray(),...t.toArray(),...prev[1].toArray(),...u.toArray());
        if(i%2===0)M.push(...t.toArray(),...u.toArray());
        prev=[t,u];
      }
    }
  };
  if(n==='Mercury'){cr(55,.06,.38);rings(sv(.3,.5,.8),[.5,.38,.27,.16],40);for(let i=0;i<10;i++)L.push(...spiral(rnd(),R,.02,.4+Math.random()*.5,.4))}
  if(n==='Venus'){cr(24,.06,.2);bands(9,.06,4);L.push(...spiral(Y,R,.02,.55,24),...spiral(Z,R,.02,.55,-24));sc(300)}
  if(n==='Earth'){
    sc(1500,isLand);sc(500,v=>!isLand(v));coastline(K,R);
    RANGES.forEach(p=>ridge(p,.022));
    L.push(...spiral(ll(-60,20),R,.02,.26,20),...spiral(ll(135,15),R,.02,.3,-18),...spiral(ll(-110,15),R,.02,.2,-18));
  }
  if(n==='Mars'){
    /* the highland / lowland boundary: Mars's "coastline" */
    for(let lo=-180;lo<180;lo+=3)K.push(...ll(lo,dich(lo)).multiplyScalar(R).toArray(),...ll(lo+3,dich(lo+3)).multiplyScalar(R).toArray());
    /* heavily cratered southern highlands, sparse northern plains */
    for(let i=0,j=0;i<46&&j<4000;j++){const c=rnd();if(!lowV(c)){L.push(...crater(c,.04+Math.random()*.2*Math.random(),R));i++}}
    for(let i=0,j=0;i<10&&j<4000;j++){const c=rnd();if(lowV(c)){L.push(...crater(c,.03+Math.random()*.08*Math.random(),R));i++}}
    /* impact basins */
    L.push(...crater(MB.hellas,.34,R),...crater(MB.argyre,.26,R),...crater(MB.isidis,.2,R));
    L.push(...crater(ll(137.8,-5.4),.035,R),...crater(ll(77.5,18.4),.025,R),...crater(ll(-17,-3),.1,R));
    /* Tharsis & Elysium volcanoes: Olympus, Arsia, Pavonis, Ascraeus, Elysium, Alba */
    [[-133.8,18.65,.1],[-120.1,-8.3,.06],[-113,.8,.06],[-104.5,11.8,.06],[146.7,25,.05],[-109.6,40.5,.11]].forEach(([lo,la,a])=>{
      const c=ll(lo,la);rings(c,[a,a*.66,a*.33,a*.12],32);D.push(...c.clone().multiplyScalar(R).toArray())});
    /* Valles Marineris */
    ladder([-90,-6,-80,-9,-72,-10,-62,-13,-52,-13,-42,-12,-36,-9],1.3);
    /* polar caps with spiral troughs */
    L.push(...circ(Y,.14,R,48),...circ(Z,.18,R,48),...spiral(Y,R,.02,.13,10),...spiral(Z,R,.02,.17,-10));
    sc(500);
  }
  if(n==='Jupiter'){bands(7,.03,5);rings(sv(.8,-.35,.5),[.24,.18,.12,.06],28,1.9);for(let i=0;i<10;i++)rings(rnd(),[.05,.025],20,1.6)}
  if(n==='Saturn'){bands(8,.02,4);rings(Y,[.24,.15,.07],6)}
  if(n==='Uranus'){bands(10,.015,3);for(const k of[1.75,1.9,2.05])for(let i=0;i<72;i++){const a=i/72*6.2832,e=(i+1)/72*6.2832;L.push(Math.cos(a)*k*r,0,Math.sin(a)*k*r,Math.cos(e)*k*r,0,Math.sin(e)*k*r)}}
  if(n==='Neptune'){bands(9,.03,6);rings(sv(.6,-.3,.5),[.2,.14,.08],28,1.7);for(let i=0;i<5;i++)rings(rnd(),[.06],20,2.2)}
  const g=new THREE.Group();
  if(L.length)g.add(segs(L,efn,1),spots(L,efn,2.5));
  if(D.length)g.add(spots(D,efn,4));
  if(K.length)g.add(segs(K,()=>kc,1),spots(K,()=>kc,3));
  if(M.length)g.add(segs(M,()=>mc,1));
  return g;
}
function orbit(d,par){
  const p=[],t=[],q=d*.02+.25;
  for(let i=0;i<96;i++){const a=i/96*6.2832;p.push(Math.cos(a)*d,0,Math.sin(a)*d)}
  for(let i=0;i<36;i++){const a=i/36*6.2832,c=Math.cos(a),s=Math.sin(a);t.push(c*(d-q),0,s*(d-q),c*(d+q),0,s*(d+q))}
  const g=mk(p);par.add(new THREE.LineLoop(g,lm(.13)),new THREE.Points(g,pm(2,.4)),new THREE.LineSegments(mk(t),lm(.3)));
}

const hash=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)};

      if(b.sh)b.sh.rotation.y-=spin(b.s)*dt*.6;

      if(b.x){b.x.rotation.y-=dt*.05;b.x2.rotation.y+=dt*.08}

    for(const k of rocks){k.rotation.x+=dt*k.userData.a;k.rotation.y+=dt*k.userData.b}
  }
  for(const b of B)if(b.o)b.h.position.set(Math.cos(b.ang)*b.o,0,-Math.sin(b.ang)*b.o);   /* counter-clockwise seen from the north */

  /* landing / leaving */
  if(site){if(landDelay>0)landDelay-=dt;else landT=Math.min(1,landT+dt/3)}

  const k=1-Math.exp(-5*dt),k2=1-Math.exp(-12*dt);

  /* labels */
  const w=innerWidth,h=innerHeight,showM=focus&&(focus.par||focus),lab=landT<.05;
  for(const b of B){
    v.copy(b.h.position).project(cam);const s=b.l.style;
    if(!lab||v.z>1||v.z<-1||b===focus)s.display='none';
    else{s.display='';s.transform='translate(calc('+((v.x*.5+.5)*w)+'px - 50%),'+((-v.y*.5+.5)*h+12)+'px)'}
  }
  for(const m of MS){
    const s=m.l.style;
    if(!lab||m.par!==showM||m===focus){s.display='none';continue}
    m.g.getWorldPosition(v).project(cam);
    if(v.z>1||v.z<-1)s.display='none';
    else{s.display='';s.transform='translate(calc('+((v.x*.5+.5)*w)+'px - 50%),'+((-v.y*.5+.5)*h+9)+'px)'}
  }
  for(const s of SITES){
    const st=s.l.style;
    if(!lab||focus!==s.b){st.display='none';continue}
    vA.copy(s.top);s.b.g.localToWorld(vA);s.b.g.getWorldPosition(vB);

    vA.project(cam);st.display='';st.transform='translate('+((vA.x*.5+.5)*w+8)+'px,'+((-vA.y*.5+.5)*h-9)+'px)';
  }

  /* tour timing */
  if(tour){
    if(!tour.started){if(landT>.55){tour.started=true;beginChapter()}}
    else{
      if(tour.auto&&!tour.hold)tour.t+=dt;
      const bar=stProg.children[tour.ch];if(bar)bar.firstChild.style.transform='scaleX('+Math.min(1,tour.hold?1:tour.t/tour.dur)+')';
      if(tour.auto&&!tour.hold&&tour.t>=tour.dur)nextChapter(false);
    }
  }

  /* readouts */
  const ck=(landT>.35?'Landed · time eased to ':'')+'1 s = <b>'+fdur(rateE)+'</b><br><b>'+nf(rateE*86400)+'×</b> real time · elapsed '+Math.floor(T/365.256)+' y '+Math.floor(T%365.256)+' d';
  if(ck!==lastClock){clock.innerHTML=ck;lastClock=ck}
  if(cs&&landT>.35){
    const hd=Math.round(((sv.yaw*57.2958)%360+360)%360),wt='<b>'+cs.name+'</b> · '+cs.coord+(cs.fp?' · '+cs.fp:'')+' · schematic ground · HDG '+String(hd).padStart(3,'0')+'°';
    if(wt!==lastWhere){whereEl.innerHTML=wt;lastWhere=wt}
  }
  ren.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
